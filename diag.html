<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Catán · Diagnóstico de conexión</title>
<style>
body{margin:0;font:16px/1.4 system-ui,-apple-system,sans-serif;background:#1d2b36;color:#fff;padding:calc(16px + env(safe-area-inset-top)) 16px 30px}
h1{font-size:22px;margin:0 0 4px}.sub{color:#d3dde4;font-size:14px;margin-bottom:16px}
.b{background:#f7efdc;color:#2b2118;border-radius:16px;padding:14px;margin-bottom:12px}
.b h2{margin:0 0 6px;font-size:17px;display:flex;justify-content:space-between;align-items:center}
.st{font-size:13px;padding:3px 10px;border-radius:99px;background:#ccc;color:#222}
.ok{background:#2e7d32;color:#fff}.slow{background:#f9a825;color:#222}.bad{background:#c62828;color:#fff}
.l{font-size:14px;margin:2px 0}.l b{font-variant-numeric:tabular-nums}
button{font:inherit;font-weight:700;border:0;border-radius:14px;padding:12px 18px;background:#c1592b;color:#fff;width:100%;margin:6px 0}
.v{font-size:15px;background:#0f1a22;border-radius:14px;padding:12px;margin-top:10px}
small{color:#6b5f52}
#net{color:#d3dde4}
</style></head><body>
<h1>📶 Diagnóstico de conexión</h1>
<div class="sub">Prueba los servidores de mensajes que usa el juego: si conectan, cuánto tardan los mensajes y si se cortan. Déjala abierta 1 minuto.</div>
<div id="list"></div>
<button id="again">Repetir prueba</button>
<div class="v" id="verdict">Probando…</div>
<div class="sub" style="margin-top:12px"><small id="net"></small></div>
<script src="vendor/mqtt.min.js"></script>
<script>
const BROKERS = [['EMQX (el principal)', 'wss://broker.emqx.io:8084/mqtt'], ['HiveMQ', 'wss://broker.hivemq.com:8884/mqtt'], ['Mosquitto', 'wss://test.mosquitto.org:8081/mqtt']];
const $ = (s) => document.querySelector(s), R = [];
const cls = (r) => (r.fail ? 'bad' : r.connMs === null ? '' : r.cuts > 0 || r.lost > 0 || (r.avg && r.avg > 900) ? 'slow' : 'ok');
const label = (r) => (r.fail ? 'No conecta' : r.connMs === null ? 'Probando…' : cls(r) === 'ok' ? 'Bien' : 'Regular');
function draw() {
  $('#list').innerHTML = R.map((r) => `<div class="b"><h2>${r.name}<span class="st ${cls(r)}">${label(r)}</span></h2>
    <div class="l">Conectar: <b>${r.fail ? '✗ ' + r.fail : r.connMs === null ? '…' : r.connMs + ' ms'}</b></div>
    <div class="l">Ida y vuelta de un mensaje: <b>${r.rtt.length ? `media ${r.avg} ms · peor ${Math.max(...r.rtt)} ms` : '…'}</b> <small>(${r.rtt.length} recibidos, ${r.lost} perdidos)</small></div>
    <div class="l">Cortes durante la prueba: <b>${r.cuts}</b></div></div>`).join('');
  const done = R.every((r) => r.fail || r.rtt.length + r.lost >= 20);
  const best = R.filter((r) => !r.fail && r.rtt.length).sort((a, b) => (a.cuts + a.lost) - (b.cuts + b.lost) || a.avg - b.avg)[0];
  const main = R[0];
  $('#verdict').innerHTML = !done ? 'Probando… (tarda en torno a un minuto)'
    : main.fail || main.cuts || main.lost > 2 ? `⚠️ El servidor principal (EMQX) está fallando desde esta conexión.${best && best !== main ? ` El que mejor va ahora es <b>${best.name}</b>.` : ''}`
    : `✅ El servidor principal responde bien desde aquí (${main.avg} ms de media).`;
  $('#net').textContent = `Red: ${navigator.connection && navigator.connection.effectiveType ? navigator.connection.effectiveType + ' · ' : ''}${navigator.onLine ? 'con internet' : 'sin internet'} · ${new Date().toLocaleString('es-ES')}`;
}
function test([name, url]) {
  const r = { name, url, connMs: null, fail: '', rtt: [], lost: 0, cuts: 0, avg: 0, sent: {} }; R.push(r);
  const t0 = performance.now(), topic = 'colonos/diag/' + Math.random().toString(36).slice(2);
  let c, n = 0, timer;
  try { c = mqtt.connect(url, { clientId: 'colonos-diag-' + Math.random().toString(36).slice(2, 10), connectTimeout: 10000, reconnectPeriod: 2000, keepalive: 10 }); }
  catch (e) { r.fail = 'error'; draw(); return; }
  const giveUp = setTimeout(() => { if (r.connMs === null) { r.fail = 'no responde en 12 s'; try { c.end(true); } catch (e) {} draw(); } }, 12000);
  let first = true;
  c.on('connect', () => {
    if (first) { first = false; r.connMs = Math.round(performance.now() - t0); clearTimeout(giveUp); }
    c.subscribe(topic, { qos: 1 }, () => {
      if (timer) return;
      timer = setInterval(() => {
        if (n >= 20) { clearInterval(timer); setTimeout(() => { for (const k in r.sent) { r.lost++; delete r.sent[k]; } draw(); try { c.end(true); } catch (e) {} }, 5000); return; }
        const id = String(n++); r.sent[id] = performance.now(); if (c.connected) c.publish(topic, id, { qos: 1 });
        for (const k in r.sent) if (performance.now() - r.sent[k] > 5000) { r.lost++; delete r.sent[k]; }
        draw();
      }, 2500);
    });
    draw();
  });
  c.on('message', (t, p) => { const id = p.toString(); if (r.sent[id] !== undefined) { r.rtt.push(Math.round(performance.now() - r.sent[id])); delete r.sent[id]; r.avg = Math.round(r.rtt.reduce((a, b) => a + b, 0) / r.rtt.length); draw(); } });
  c.on('offline', () => { if (r.connMs !== null) { r.cuts++; draw(); } });
  c.on('error', (e) => { if (r.connMs === null) { r.fail = (e && e.message) || 'error'; draw(); } });
  r.end = () => { clearInterval(timer); clearTimeout(giveUp); try { c.end(true); } catch (e) {} };
}
function run() { R.splice(0).forEach((r) => r.end && r.end()); BROKERS.forEach(test); draw(); }
$('#again').onclick = run; run();
</script>
</body></html>
