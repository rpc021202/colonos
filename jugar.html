<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fbf6ea">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Colonos · mando</title>
<link rel="icon" href="favicon.svg">
<link rel="stylesheet" href="css/app.css">
<style>
html,body{background:var(--paper);overscroll-behavior:none}
body{min-height:100dvh}
#app{display:flex;flex-direction:column;height:100dvh;padding-top:env(safe-area-inset-top)}
/* acceso */
.join{padding:28px 20px;max-width:460px;margin:0 auto;width:100%}
.join h1{margin:0;font-size:38px}
.join input{width:100%;font-size:18px}
.join .code{text-transform:uppercase;letter-spacing:.3em;font-weight:700;font-size:26px;text-align:center}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.sw button{aspect-ratio:1;border-radius:12px;border:3px solid rgba(0,0,0,.15);padding:0}
.sw button.sel{outline:4px solid var(--ink);outline-offset:2px}
.sw button:disabled{opacity:.25}
.big{width:100%;font-size:19px;padding:15px;margin-top:18px}
.wait{text-align:center;padding:30px 20px;color:var(--muted)}
.dots::after{content:'…';animation:d 1.2s steps(4) infinite}
.lp{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:6px;font-weight:600}
/* partida */
.top{display:flex;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--paper);flex:none}
.top .who{font-weight:700;font-size:17px;line-height:1.1}
.top .what{font-size:13px;color:var(--muted)}
.top .grow{flex:1;min-width:0}
.top .grow>*{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini{display:flex;gap:4px}
.mini .d{width:28px;height:28px;background:#fff;border-radius:7px;display:grid;place-items:center;font-weight:700;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.myvp{background:#2b2118;color:#fff;border-radius:10px;padding:3px 9px;font-weight:700}
.net{width:10px;height:10px;border-radius:50%;background:var(--ok)}
.net.bad{background:#d33;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.3}}
.body{flex:1;min-height:0;overflow-y:auto;padding:14px;position:relative}
.body.mapmode{padding:0;overflow:hidden}
.dock{flex:none;padding:8px 14px;border-top:1px solid var(--line);background:var(--paper);display:flex;gap:8px}
.dock button{flex:1;font-size:18px;padding:13px}
.dock:empty{display:none}
.tabs{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:#f3ead6;padding-bottom:env(safe-area-inset-bottom)}
.tabs button{background:transparent;border-radius:0;padding:8px 2px 9px;font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;position:relative}
.tabs button .i{font-size:21px}
.tabs button.cur{color:var(--ink);background:var(--paper)}
.tabs .dot{position:absolute;top:6px;right:calc(50% - 20px);width:9px;height:9px;border-radius:50%;background:var(--accent)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.sec h3{margin:0 0 9px;font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between;align-items:center}
.hand{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.acts button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:11px 12px}
.acts .cost{font-size:13px;font-weight:500;letter-spacing:1px}
.dev{display:flex;align-items:center;gap:10px;background:#f4ecda;border-radius:12px;padding:8px 10px;margin-bottom:6px}
.dev .t{flex:1;font-weight:600;font-size:15px}
.dev .t small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.costs{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;font-size:15px}
.costs .pts{color:var(--muted);font-size:12px;text-align:right}
.pl{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px dashed var(--line);font-size:15px}
.pl:last-child{border-bottom:0}
.pl.cur{background:#f6ead0;border-radius:10px}
.pl .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl .st{color:var(--muted);font-size:12.5px;white-space:nowrap}
.pl .vp{font-weight:700;min-width:26px;text-align:right}
.log{font-size:14px;color:#4a3d30}
.log div{padding:4px 0;border-bottom:1px solid #f1e8d6}
.picker{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:8px 0}
.picker button{padding:9px 2px;display:flex;flex-direction:column;align-items:center;font-size:12px;gap:2px}
.picker .e{font-size:24px}
.cnt{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:6px 0 12px}
.cnt .c{background:#f4ecda;border-radius:12px;text-align:center;padding:6px 2px}
.cnt .c .e{font-size:22px}
.cnt .c .v{font-weight:700;font-size:20px}
.cnt .c .b{display:flex;justify-content:center;gap:4px}
.cnt .c button{padding:4px 0;width:30px;font-size:18px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>button{flex:1}
.offer{background:#fff4e2;border:2px solid var(--accent2);border-radius:var(--radius);padding:12px;margin-bottom:12px}
.offer .r{display:flex;align-items:center;gap:8px;padding:6px 0;font-size:15px}
/* mapa */
#mapwrap{position:absolute;inset:0;touch-action:none;background:#2f86b5}
#map{width:100%;height:100%;display:block}
.tgtv{fill:#fff;stroke:#2b2118;stroke-width:.04;animation:pulse 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tgtv.on{fill:var(--accent);animation:none}
@keyframes pulse{50%{transform:scale(1.3);opacity:.75}}
.tgte{stroke:#fff;stroke-width:.13;stroke-linecap:round;stroke-dasharray:.08 .12;pointer-events:none;animation:dash .6s linear infinite}
.tgte.on{stroke:var(--accent);stroke-dasharray:none;stroke-width:.18}
@keyframes dash{to{stroke-dashoffset:-.2}}
.hit{stroke:transparent;stroke-width:.4;stroke-linecap:round}
.hitv{fill:transparent}
.tgth{fill:rgba(255,255,255,.18);stroke:#fff;stroke-width:.07;animation:glow 1s ease-in-out infinite}
.tgth.on{fill:rgba(193,89,43,.45);stroke:var(--accent);animation:none}
@keyframes glow{50%{fill:rgba(255,255,255,.4)}}
.maphint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:rgba(251,246,234,.95);padding:7px 14px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 3px 12px rgba(0,0,0,.25);white-space:nowrap;max-width:94%;overflow:hidden;text-overflow:ellipsis}
.zoom{position:absolute;right:10px;bottom:10px;display:flex;flex-direction:column;gap:6px}
.zoom button{width:44px;height:44px;padding:0;font-size:20px;background:rgba(251,246,234,.95);box-shadow:0 2px 8px rgba(0,0,0,.25)}
/* modales */
.modal{position:fixed;inset:0;background:rgba(10,25,35,.55);display:flex;align-items:flex-end;justify-content:center;z-index:40}
.modal .box{background:var(--paper);border-radius:22px 22px 0 0;padding:20px 18px calc(18px + env(safe-area-inset-bottom));width:100%;max-width:520px;max-height:88dvh;overflow-y:auto;animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.modal h2{margin:0 0 4px;font-size:23px}
.modal p{margin:0 0 12px;color:var(--muted)}
.lost{position:fixed;top:0;left:0;right:0;background:#b3261e;color:#fff;text-align:center;font-weight:600;padding:calc(6px + env(safe-area-inset-top)) 10px 6px;z-index:50;font-size:14px}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three/three.module.js","three/addons/":"./vendor/three/addons/"}}</script>
<script src="vendor/peerjs.min.js"></script>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>
<script type="module" src="js/client.js"></script>
</body>
</html>
